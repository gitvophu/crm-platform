<title>Nova CRM Shell</title>
<meta name="claude:viewport-fit-sides" content="cover" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap"
/>
<style>
  /* Layout: app shell = fixed-width sidebar + header + content; a review bar above the frame
     switches screens and states. Light theme only (slice 1.1, Q7), so colors are set explicitly. */
  :root {
    color-scheme: light;
    /* shadcn-style tokens: zinc neutrals, teal primary */
    --background: oklch(1 0 0);
    --foreground: oklch(0.141 0.005 285.8);
    --muted: oklch(0.967 0.001 286.4);
    --muted-foreground: oklch(0.552 0.016 285.9);
    --border: oklch(0.92 0.004 286.3);
    --primary: oklch(0.5 0.09 192);
    --primary-foreground: oklch(0.985 0 0);
    --primary-soft: oklch(0.95 0.03 192);
    --sidebar: oklch(0.985 0.001 286.4);
    --sidebar-accent: oklch(0.94 0.004 286.3);
    --success: oklch(0.6 0.15 150);
    --warning: oklch(0.72 0.15 75);
    --destructive: oklch(0.577 0.245 27.3);
    --destructive-soft: oklch(0.97 0.02 27);
    --review-bg: oklch(0.27 0.01 286);
    --review-fg: oklch(0.96 0 0);
    --radius: 0.625rem;
    --font-sans: 'Geist', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
    --font-mono: 'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  }

  * {
    box-sizing: border-box;
  }
  html,
  body {
    height: 100%;
  }
  body {
    margin: 0;
    background: oklch(0.93 0.004 286.3);
    color: var(--foreground);
    font-family: var(--font-sans);
    font-size: 14px;
    line-height: 1.5;
    display: flex;
    flex-direction: column;
  }
  button {
    font: inherit;
    color: inherit;
  }
  :focus-visible {
    outline: 2px solid var(--primary);
    outline-offset: 2px;
  }

  /* ---------- review bar (not part of the app) ---------- */
  .review {
    background: var(--review-bg);
    color: var(--review-fg);
    padding-block: 10px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: flex;
    flex-wrap: wrap;
    gap: 10px 20px;
    align-items: center;
    font-size: 12px;
  }
  .review strong {
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    font-size: 11px;
    opacity: 0.8;
  }
  .review-group {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    align-items: center;
  }
  .review-group > span {
    opacity: 0.7;
  }
  .chip {
    border: 1px solid oklch(0.45 0.01 286);
    background: transparent;
    color: var(--review-fg);
    border-radius: 999px;
    padding: 2px 10px;
    cursor: pointer;
    font-size: 12px;
  }
  .chip[aria-pressed='true'] {
    background: var(--review-fg);
    color: var(--review-bg);
    border-color: var(--review-fg);
  }
  .notes {
    flex-basis: 100%;
    opacity: 0.85;
    min-width: 0;
  }

  /* ---------- app shell ---------- */
  .frame {
    flex: 1;
    min-height: 0;
    display: flex;
    background: var(--background);
    position: relative;
    overflow: hidden;
  }
  .sidebar {
    width: 240px;
    flex-shrink: 0;
    background: var(--sidebar);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    transition: width 0.15s ease;
  }
  .collapsed .sidebar {
    width: 56px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 12px;
    height: 56px;
  }
  .logo {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    background: var(--primary);
    color: var(--primary-foreground);
    display: grid;
    place-items: center;
    font-weight: 600;
    flex-shrink: 0;
  }
  .brand-text {
    display: grid;
    line-height: 1.2;
    min-width: 0;
  }
  .brand-text b {
    font-weight: 600;
  }
  .brand-text small {
    color: var(--muted-foreground);
    font-size: 12px;
  }
  .nav {
    padding: 8px;
    display: grid;
    gap: 2px;
  }
  .nav-label {
    font-size: 11px;
    color: var(--muted-foreground);
    padding: 8px 8px 4px;
    letter-spacing: 0.02em;
  }
  .nav a {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 8px;
    border-radius: calc(var(--radius) - 4px);
    color: var(--foreground);
    text-decoration: none;
    height: 32px;
    white-space: nowrap;
  }
  .nav a:hover {
    background: var(--sidebar-accent);
  }
  .nav a[aria-current='page'] {
    background: var(--sidebar-accent);
    font-weight: 500;
  }
  .nav a[aria-current='page'] svg {
    color: var(--primary);
  }
  .nav .soon {
    margin-left: auto;
    font-size: 10px;
    color: var(--muted-foreground);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 0 6px;
  }
  .collapsed .brand-text,
  .collapsed .nav-label,
  .collapsed .nav-text,
  .collapsed .soon,
  .collapsed .status-text {
    display: none;
  }
  .collapsed .nav a {
    justify-content: center;
  }
  .sidebar-foot {
    margin-top: auto;
    padding: 12px;
    border-top: 1px solid var(--border);
  }
  .status {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--muted-foreground);
  }
  .collapsed .status {
    justify-content: center;
  }
  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .dot.ok {
    background: var(--success);
  }
  .dot.warn {
    background: var(--warning);
  }
  .dot.down {
    background: var(--destructive);
  }

  .main {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
  }
  .header {
    height: 56px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 16px;
  }
  .icon-btn {
    width: 32px;
    height: 32px;
    display: grid;
    place-items: center;
    border: 0;
    border-radius: calc(var(--radius) - 4px);
    background: transparent;
    cursor: pointer;
    color: var(--foreground);
  }
  .icon-btn:hover {
    background: var(--muted);
  }
  .sep {
    width: 1px;
    height: 16px;
    background: var(--border);
  }
  .crumbs {
    display: flex;
    gap: 6px;
    align-items: center;
    color: var(--muted-foreground);
    min-width: 0;
  }
  .crumbs b {
    color: var(--foreground);
    font-weight: 500;
  }
  .content {
    flex: 1;
    overflow: auto;
    padding: 24px;
  }
  .page {
    max-width: 960px;
    display: grid;
    gap: 20px;
  }
  h1 {
    font-size: 24px;
    font-weight: 600;
    letter-spacing: -0.01em;
    margin: 0;
    text-wrap: balance;
  }
  .lede {
    color: var(--muted-foreground);
    margin: 4px 0 0;
  }

  .card {
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--background);
    padding: 20px;
  }
  .card h2 {
    font-size: 14px;
    font-weight: 600;
    margin: 0 0 4px;
  }
  .card p {
    margin: 0;
    color: var(--muted-foreground);
  }
  .grid-2 {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 16px;
  }
  .svc {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 12px 0;
    border-top: 1px solid var(--border);
  }
  .svc:first-of-type {
    border-top: 0;
  }
  .svc-name {
    display: grid;
  }
  .svc-name small {
    color: var(--muted-foreground);
    font-family: var(--font-mono);
    font-size: 12px;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 500;
    border-radius: 999px;
    padding: 2px 10px;
    border: 1px solid var(--border);
  }
  .meta {
    font-size: 12px;
    color: var(--muted-foreground);
    margin-top: 12px;
    font-variant-numeric: tabular-nums;
  }

  .empty {
    display: grid;
    justify-items: center;
    text-align: center;
    gap: 8px;
    padding: 56px 24px;
    border: 1px dashed var(--border);
    border-radius: var(--radius);
  }
  .empty-icon {
    width: 44px;
    height: 44px;
    border-radius: 12px;
    background: var(--primary-soft);
    color: var(--primary);
    display: grid;
    place-items: center;
  }
  .empty h2 {
    margin: 4px 0 0;
    font-size: 16px;
    font-weight: 600;
  }
  .empty p {
    margin: 0;
    color: var(--muted-foreground);
    max-width: 44ch;
  }
  .empty ul {
    margin: 8px 0 0;
    padding: 0;
    list-style: none;
    display: grid;
    gap: 4px;
    color: var(--muted-foreground);
    font-size: 13px;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    height: 32px;
    padding: 0 12px;
    border-radius: calc(var(--radius) - 2px);
    border: 1px solid var(--border);
    background: var(--background);
    cursor: pointer;
    font-weight: 500;
    font-size: 13px;
    text-decoration: none;
    color: var(--foreground);
  }
  .btn:hover {
    background: var(--muted);
  }
  .btn-primary {
    background: var(--primary);
    color: var(--primary-foreground);
    border-color: var(--primary);
  }
  .btn-primary:hover {
    background: oklch(0.45 0.09 192);
  }

  .error {
    border: 1px solid oklch(0.88 0.06 27);
    background: var(--destructive-soft);
    border-radius: var(--radius);
    padding: 16px;
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 4px 12px;
  }
  .error svg {
    color: var(--destructive);
    grid-row: span 3;
    margin-top: 2px;
  }
  .error b {
    font-weight: 600;
  }
  .error p {
    margin: 0;
    color: var(--foreground);
  }
  .error .actions {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: center;
    margin-top: 8px;
  }
  .reqid {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--muted-foreground);
    min-width: 0;
    overflow-wrap: anywhere;
  }

  .skeleton {
    background: linear-gradient(90deg, var(--muted), oklch(0.985 0 0), var(--muted));
    background-size: 200% 100%;
    animation: shimmer 1.4s infinite;
    border-radius: 6px;
    height: 14px;
  }
  @keyframes shimmer {
    to {
      background-position: -200% 0;
    }
  }
  @media (prefers-reduced-motion: reduce) {
    .skeleton {
      animation: none;
    }
    .sidebar {
      transition: none;
    }
  }

  .notfound {
    display: grid;
    gap: 8px;
    justify-items: start;
    padding: 40px 0;
  }
  .notfound .code {
    font-family: var(--font-mono);
    color: var(--muted-foreground);
    font-size: 13px;
  }
  .notfound code {
    font-family: var(--font-mono);
    background: var(--muted);
    padding: 1px 6px;
    border-radius: 4px;
  }

  .toast {
    position: absolute;
    right: 16px;
    bottom: 16px;
    width: min(360px, calc(100% - 32px));
    background: var(--background);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow:
      0 8px 24px oklch(0.2 0.01 286 / 0.12),
      0 1px 3px oklch(0.2 0.01 286 / 0.08);
    padding: 14px 16px;
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 2px 10px;
  }
  .toast svg {
    color: var(--destructive);
    grid-row: span 2;
    margin-top: 2px;
  }
  .toast b {
    font-weight: 600;
  }
  .toast span {
    color: var(--muted-foreground);
    font-size: 13px;
  }

  .devtools {
    position: absolute;
    left: 12px;
    bottom: 12px;
    display: flex;
    gap: 6px;
  }
  .collapsed .devtools,
  .devtools {
    pointer-events: none;
  }
  .devtools span {
    font-size: 10px;
    font-family: var(--font-mono);
    background: oklch(0.22 0.01 286);
    color: oklch(0.9 0 0);
    border-radius: 999px;
    padding: 3px 8px;
    opacity: 0.85;
  }

  .scrim {
    display: none;
  }
  @media (max-width: 720px) {
    .sidebar {
      position: absolute;
      inset: 0 auto 0 0;
      z-index: 20;
      transform: translateX(-100%);
      transition: transform 0.15s ease;
      box-shadow: 0 0 24px oklch(0.2 0.01 286 / 0.15);
    }
    .mobile-open .sidebar {
      transform: none;
    }
    .mobile-open .scrim {
      display: block;
      position: absolute;
      inset: 0;
      background: oklch(0.2 0.01 286 / 0.3);
      z-index: 10;
    }
    .collapsed .sidebar {
      width: 240px;
    }
    .collapsed .brand-text,
    .collapsed .nav-label,
    .collapsed .nav-text,
    .collapsed .soon,
    .collapsed .status-text {
      display: revert;
    }
    .content {
      padding: 16px;
    }
    .devtools {
      display: none;
    }
  }
</style>

<div class="review" role="region" aria-label="Review controls">
  <strong>Mockup · slice 1.1</strong>
  <div class="review-group" data-group="state">
    <span>Data</span>
    <button class="chip" data-state="ok" aria-pressed="true">Loaded</button>
    <button class="chip" data-state="loading" aria-pressed="false">Loading</button>
    <button class="chip" data-state="error" aria-pressed="false">Load error</button>
  </div>
  <div class="review-group" data-group="api">
    <span>API</span>
    <button class="chip" data-api="ok" aria-pressed="true">OK</button>
    <button class="chip" data-api="db" aria-pressed="false">DB down</button>
    <button class="chip" data-api="down" aria-pressed="false">Unreachable</button>
  </div>
  <div class="review-group">
    <button class="chip" id="toggle-collapse" aria-pressed="false">Collapse sidebar</button>
    <button class="chip" id="show-toast" aria-pressed="false">Show toast</button>
    <a class="chip" href="#nope" style="text-decoration: none">Open unknown URL</a>
  </div>
  <p class="notes" id="notes"></p>
</div>

  <aside class="sidebar" aria-label="Main navigation">

      <div class="logo" aria-hidden="true">N</div>

    <nav class="nav">
      <a href="#dashboard" data-route="dashboard"
        ><svg

        >
          <rect x="3" y="3" width="7" height="9" rx="1" />

          <rect x="14" y="12" width="7" height="9" rx="1" />

        ><svg

        >
          <rect x="3" y="3" width="5" height="18" rx="1" />

      <a href="#activities" data-route="activities"

    </nav>
    <div class="sidebar-foot">
      <div class="status" id="foot-status" title="System status">
        <span class="dot ok"></span><span class="status-text">All systems operational</span>
      </div>
    </div>
  </aside>

  <div class="main">
    <header class="header">
      <button class="icon-btn" id="sidebar-trigger" aria-label="Toggle sidebar">
        <svg
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"

        >
          <rect x="3" y="3" width="18" height="18" rx="2" />

    <svg

  <div class="devtools" aria-hidden="true">
    <span>Router devtools</span><span>Query devtools</span>

</div>

<script>
  const routes = {
    dashboard: { title: 'Dashboard' },
    contacts: {
      title: 'Contacts',
      what: 'people at your client companies',
      bullets: [
        'Search, filter and sort your contacts',
        'See only your team’s contacts',
        'Owner and team on every record',
      ],
    },
    companies: {
      title: 'Companies',
      what: 'the brands and businesses Nova works for',
      bullets: [
        'Company profile and industry',
        'Contacts that belong to the company',
        'Deals and activity in one place',
      ],
    },
    deals: {
      title: 'Deals',
      what: 'service contracts, one-off or monthly retainer',
      bullets: [
        'Pipeline board from lead to won',
        'Drag a deal to change its stage',
        'Contract value and type',
      ],
    },
    activities: {
      title: 'Activities',
      what: 'calls, meetings and notes with clients',
      bullets: [
        'Log a call, meeting or note',
        'Timeline on contacts, companies and deals',
        'Who did what, and when',
      ],
    },
  };
  const notesByRoute = {
    dashboard:
      'Dashboard: status card replaces the Phase 0 health line. Try Data and API switches. Sidebar footer mirrors the API state.',
    placeholder:
      'Placeholder page for a module that arrives in a later slice. Menu shows "Soon" until then.',
    notfound: '404 renders inside the layout, so navigation stays available.',
  };
  const state = { route: 'dashboard', data: 'ok', api: 'ok', collapsed: false, mobileOpen: false };

  const icons = {
    alert:
      '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>',
    retry:
      '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>',
    clock:
      '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>',
  };

  const apiText = {
    ok: { dot: 'ok', foot: 'All systems operational', api: ['ok', 'Online'], db: ['ok', 'Online'] },
    db: {
      dot: 'warn',
      foot: 'Database unavailable',
      api: ['ok', 'Online'],
      db: ['down', 'Unavailable'],
    },
    down: {
      dot: 'down',
      foot: 'Can’t reach the API',
      api: ['down', 'Unreachable'],
      db: ['warn', 'Unknown'],
    },
  };

  function badge([kind, label]) {
    return `<span class="badge"><span class="dot ${kind}"></span>${label}</span>`;
  }

  function errorState(what) {
    return `<div class="error" role="alert">${icons.alert}<b>Couldn’t load ${what}</b>
      <p>The server answered with an error (500). Try again in a moment.</p>
      <div class="actions"><button class="btn" type="button">${icons.retry}Try again</button>
      <span class="reqid">Request ID c21b8e04-5d7f-4a1e-9b3c-0e6f2a91d4b7</span></div></div>`;
  }

  function dashboard() {
    const s = apiText[state.api];
    let status;
    if (state.data === 'loading') {
      status = `<div class="card" aria-busy="true"><h2>System status</h2><p>Checking services…</p>
        <div style="display:grid;gap:14px;margin-top:16px"><div class="skeleton" style="width:60%"></div><div class="skeleton" style="width:45%"></div></div></div>`;
    } else if (state.data === 'error') {
      status = errorState('system status');
    } else {
      status = `<div class="card"><h2>System status</h2><p>Checked every 10 seconds.</p>
        <div style="margin-top:12px">
          <div class="svc"><div class="svc-name">API<small>GET /api/health</small></div>${badge(s.api)}</div>
          <div class="svc"><div class="svc-name">Database<small>PostgreSQL 18</small></div>${badge(s.db)}</div>
        </div><div class="meta">Last checked 14:32:05</div></div>`;
    }
    return `<div class="page"><div><h1>Dashboard</h1><p class="lede">Overview of your workspace.</p></div>
      <div class="grid-2">${status}
        <div class="card"><h2>Getting started</h2><p>Contacts, companies and deals will show up here as they are added to Nova CRM.</p></div>
      </div></div>`;
  }

  function placeholder(r) {
    return `<div class="page"><div><h1>${r.title}</h1><p class="lede">Manage ${r.what}.</p></div>
      <div class="empty"><div class="empty-icon">${icons.clock}</div><h2>${r.title} is coming soon</h2>
      <p>This part of Nova CRM is being built. Here is what it will do:</p>
      <ul>${r.bullets.map((b) => `<li>${b}</li>`).join('')}</ul>
      <a class="btn" href="#dashboard" style="margin-top:12px">Back to dashboard</a></div></div>`;
  }

  function notFound(hash) {
    return `<div class="page"><div class="notfound"><span class="code">404</span><h1>Page not found</h1>
      <p class="lede">There is no page at <code>/${hash}</code>. Check the address or go back to the dashboard.</p>
      <a class="btn btn-primary" href="#dashboard" style="margin-top:8px">Go to dashboard</a></div></div>`;
  }

  function render() {
    const hash = location.hash.slice(1) || 'dashboard';
    const route = routes[hash] ? hash : null;
    state.route = route ?? 'notfound';
    const frame = document.getElementById('frame');
    frame.classList.toggle('collapsed', state.collapsed);
    frame.classList.toggle('mobile-open', state.mobileOpen);

    document.querySelectorAll('.nav a').forEach((a) => {
      if (a.dataset.route === route) a.setAttribute('aria-current', 'page');
      else a.removeAttribute('aria-current');
    });

    const title = route ? routes[route].title : 'Page not found';
    document.getElementById('crumbs').innerHTML =
      `<span>Nova CRM</span><span aria-hidden="true">/</span><b>${title}</b>`;

    const content = document.getElementById('content');
    content.innerHTML = !route
      ? notFound(hash)
      : route === 'dashboard'
        ? dashboard()
        : placeholder(routes[route]);

    const s = apiText[state.api];
    document.getElementById('foot-status').innerHTML =
      `<span class="dot ${s.dot}"></span><span class="status-text">${s.foot}</span>`;
    document.getElementById('foot-status').title = s.foot;

    document.getElementById('notes').textContent =
      route === 'dashboard'
        ? notesByRoute.dashboard
        : route
          ? notesByRoute.placeholder
          : notesByRoute.notfound;
  }

  function press(group, attr, value) {
    document
      .querySelectorAll(`[data-group="${group}"] .chip`)
      .forEach((c) => c.setAttribute('aria-pressed', String(c.dataset[attr] === value)));
  }

  document.querySelectorAll('[data-state]').forEach((b) =>
    b.addEventListener('click', () => {
      state.data = b.dataset.state;
      press('state', 'state', state.data);
      render();
    }),
  );
  document.querySelectorAll('[data-api]').forEach((b) =>
    b.addEventListener('click', () => {
      state.api = b.dataset.api;
      press('api', 'api', state.api);
      render();
    }),
  );
  const collapseBtn = document.getElementById('toggle-collapse');
  function toggleSidebar() {
    if (window.matchMedia('(max-width: 720px)').matches) state.mobileOpen = !state.mobileOpen;
    else state.collapsed = !state.collapsed;
    collapseBtn.setAttribute('aria-pressed', String(state.collapsed));
    render();
  }
  collapseBtn.addEventListener('click', toggleSidebar);
  document.getElementById('sidebar-trigger').addEventListener('click', toggleSidebar);
  document.getElementById('scrim').addEventListener('click', () => {
    state.mobileOpen = false;
    render();
  });
  const toastBtn = document.getElementById('show-toast');
  let toastTimer;
  toastBtn.addEventListener('click', () => {
    const toast = document.getElementById('toast');
    toast.hidden = false;
    toastBtn.setAttribute('aria-pressed', 'true');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => {
      toast.hidden = true;
      toastBtn.setAttribute('aria-pressed', 'false');
    }, 5000);
  });
  document
    .querySelectorAll('.nav a')
    .forEach((a) => a.addEventListener('click', () => (state.mobileOpen = false)));
  window.addEventListener('hashchange', render);
  render();
</script>
