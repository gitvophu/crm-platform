<title>Nova CRM Sign-in</title>
<meta name="claude:viewport-fit-sides" content="cover" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap"
/>
<style>
  /* Mockup slice 1.2: login, user menu, account. Same tokens as slice 1.1 (zinc + teal, light only). */
  :root {
    color-scheme: light;
    --background: oklch(1 0 0);
    --foreground: oklch(0.141 0.005 285.8);
    --muted: oklch(0.967 0.001 286.4);
    --muted-foreground: oklch(0.552 0.016 285.9);
    --border: oklch(0.92 0.004 286.3);
    --input: oklch(0.92 0.004 286.3);
    --primary: oklch(0.5 0.09 192);
    --primary-hover: oklch(0.45 0.09 192);
    --primary-foreground: oklch(0.985 0 0);
    --primary-soft: oklch(0.95 0.03 192);
    --ring: oklch(0.7 0.08 192);
    --sidebar: oklch(0.985 0.001 286.4);
    --sidebar-accent: oklch(0.94 0.004 286.3);
    --success: oklch(0.6 0.15 150);
    --destructive: oklch(0.577 0.245 27.3);
    --destructive-soft: oklch(0.97 0.02 27);
    --review-bg: oklch(0.27 0.01 286);
    --review-fg: oklch(0.96 0 0);
    --radius: 0.625rem;
    --font-sans: 'Geist', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
    --font-mono: 'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  }
  * {
    box-sizing: border-box;
  }
  html,
  body {
    height: 100%;
  }
  body {
    margin: 0;
    background: oklch(0.93 0.004 286.3);
    color: var(--foreground);
    font-family: var(--font-sans);
    font-size: 14px;
    line-height: 1.5;
    display: flex;
    flex-direction: column;
  }
  button,
  input {
    font: inherit;
    color: inherit;
  }
  :focus-visible {
    outline: 2px solid var(--ring);
    outline-offset: 2px;
  }

  /* ---------- review bar (not part of the app) ---------- */
  .review {
    background: var(--review-bg);
    color: var(--review-fg);
    padding-block: 10px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: flex;
    flex-wrap: wrap;
    gap: 10px 20px;
    align-items: center;
    font-size: 12px;
  }
  .review strong {
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    font-size: 11px;
    opacity: 0.8;
  }
  .review-group {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    align-items: center;
  }
  .review-group > span {
    opacity: 0.7;
  }
  .review-group[hidden] {
    display: none;
  }
  .chip {
    border: 1px solid oklch(0.45 0.01 286);
    background: transparent;
    color: var(--review-fg);
    border-radius: 999px;
    padding: 2px 10px;
    cursor: pointer;
    font-size: 12px;
  }
  .chip[aria-pressed='true'] {
    background: var(--review-fg);
    color: var(--review-bg);
    border-color: var(--review-fg);
  }
  .notes {
    flex-basis: 100%;
    opacity: 0.85;
    margin: 0;
    min-width: 0;
  }

  .frame {
    flex: 1;
    min-height: 0;
    display: flex;
    background: var(--background);
    position: relative;
    overflow: hidden;
  }

  /* ---------- shared controls ---------- */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    height: 36px;
    padding: 0 14px;
    border-radius: calc(var(--radius) - 2px);
    border: 1px solid var(--border);
    background: var(--background);
    cursor: pointer;
    font-weight: 500;
    font-size: 14px;
  }
  .btn:hover {
    background: var(--muted);
  }
  .btn-primary {
    background: var(--primary);
    color: var(--primary-foreground);
    border-color: var(--primary);
  }
  .btn-primary:hover {
    background: var(--primary-hover);
  }
  .btn[disabled] {
    opacity: 0.6;
    cursor: default;
  }
  .field {
    display: grid;
    gap: 6px;
  }
  .field label {
    font-weight: 500;
  }
  .field input {
    height: 36px;
    border: 1px solid var(--input);
    border-radius: calc(var(--radius) - 2px);
    padding: 0 12px;
    background: var(--background);
    width: 100%;
    min-width: 0;
  }
  .field input:focus-visible {
    outline: none;
    border-color: var(--ring);
    box-shadow: 0 0 0 3px oklch(0.7 0.08 192 / 0.3);
  }
  .field input[aria-invalid='true'] {
    border-color: var(--destructive);
  }
  .field .hint {
    font-size: 12px;
    color: var(--muted-foreground);
  }
  .field .err {
    font-size: 12px;
    color: var(--destructive);
  }
  .alert {
    display: flex;
    gap: 8px;
    align-items: flex-start;
    border-radius: calc(var(--radius) - 2px);
    padding: 10px 12px;
    font-size: 13px;
  }
  .alert svg {
    flex-shrink: 0;
    margin-top: 2px;
  }
  .alert-error {
    background: var(--destructive-soft);
    border: 1px solid oklch(0.88 0.06 27);
  }
  .alert-error svg {
    color: var(--destructive);
  }
  .alert-info {
    background: var(--primary-soft);
    border: 1px solid oklch(0.88 0.04 192);
  }
  .alert-info svg {
    color: var(--primary);
  }
  .spinner {
    width: 14px;
    height: 14px;
    border: 2px solid currentColor;
    border-right-color: transparent;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin {
    to {
      transform: rotate(360deg);
    }
  }
  @media (prefers-reduced-motion: reduce) {
    .spinner {
      animation: none;
    }
  }

  /* ---------- login ---------- */
  .login {
    flex: 1;
    display: grid;
    place-items: center;
    padding: 32px max(16px, env(safe-area-inset-right, 0px)) 32px
      max(16px, env(safe-area-inset-left, 0px));
    background: var(--sidebar);
    overflow: auto;
  }
  .login-wrap {
    width: min(380px, 100%);
    display: grid;
    gap: 20px;
  }
  .login-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    justify-content: center;
  }
  .logo {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    background: var(--primary);
    color: var(--primary-foreground);
    display: grid;
    place-items: center;
    font-weight: 600;
    flex-shrink: 0;
  }
  .login-brand b {
    font-size: 16px;
    font-weight: 600;
  }
  .card {
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--background);
    padding: 24px;
    display: grid;
    gap: 16px;
    box-shadow: 0 1px 3px oklch(0.2 0.01 286 / 0.06);
  }
  .card h1,
  .card h2 {
    margin: 0;
    font-size: 18px;
    font-weight: 600;
    text-wrap: balance;
  }
  .card .sub {
    margin: 4px 0 0;
    color: var(--muted-foreground);
  }
  .login-foot {
    text-align: center;
    font-size: 12px;
    color: var(--muted-foreground);
    margin: 0;
  }

  /* ---------- app shell (from slice 1.1) ---------- */
  .sidebar {
    width: 240px;
    flex-shrink: 0;
    background: var(--sidebar);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 12px;
    height: 56px;
  }
  .brand-text {
    display: grid;
    line-height: 1.2;
  }
  .brand-text b {
    font-weight: 600;
  }
  .brand-text small {
    color: var(--muted-foreground);
    font-size: 12px;
  }
  .nav {
    padding: 8px;
    display: grid;
    gap: 2px;
  }
  .nav-label {
    font-size: 11px;
    color: var(--muted-foreground);
    padding: 8px 8px 4px;
  }
  .nav span.item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 8px;
    border-radius: calc(var(--radius) - 4px);
    height: 32px;
    color: var(--foreground);
  }
  .nav .soon {
    margin-left: auto;
    font-size: 10px;
    color: var(--muted-foreground);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 0 6px;
  }
  .sidebar-foot {
    margin-top: auto;
    padding: 12px;
    border-top: 1px solid var(--border);
    font-size: 12px;
    color: var(--muted-foreground);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--success);
  }
  .main {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
  }
  .header {
    height: 56px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 16px;
    position: relative;
  }
  .crumbs {
    display: flex;
    gap: 6px;
    align-items: center;
    color: var(--muted-foreground);
    min-width: 0;
  }
  .crumbs b {
    color: var(--foreground);
    font-weight: 500;
  }
  .user-btn {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 8px;
    border: 0;
    background: transparent;
    padding: 4px 8px 4px 4px;
    border-radius: 999px;
    cursor: pointer;
  }
  .user-btn:hover,
  .user-btn[aria-expanded='true'] {
    background: var(--muted);
  }
  .avatar {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: var(--primary-soft);
    color: var(--primary);
    display: grid;
    place-items: center;
    font-size: 12px;
    font-weight: 600;
  }
  .avatar.lg {
    width: 44px;
    height: 44px;
    font-size: 16px;
  }
  .menu {
    position: absolute;
    right: 16px;
    top: 52px;
    width: 240px;
    background: var(--background);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow:
      0 8px 24px oklch(0.2 0.01 286 / 0.12),
      0 1px 3px oklch(0.2 0.01 286 / 0.08);
    padding: 4px;
    z-index: 5;
  }
  .menu-head {
    padding: 8px 8px 10px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 4px;
    display: grid;
    min-width: 0;
  }
  .menu-head b {
    font-weight: 500;
  }
  .menu-head span {
    font-size: 12px;
    color: var(--muted-foreground);
    overflow-wrap: anywhere;
  }
  .role {
    display: inline-flex;
    gap: 6px;
    align-items: center;
    margin-top: 6px;
    font-size: 12px;
    color: var(--muted-foreground);
  }
  .tag {
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 0 8px;
    font-size: 11px;
    color: var(--foreground);
  }
  .menu button {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    border: 0;
    background: transparent;
    padding: 6px 8px;
    border-radius: calc(var(--radius) - 4px);
    cursor: pointer;
    text-align: left;
  }
  .menu button:hover {
    background: var(--muted);
  }
  .menu hr {
    border: 0;
    border-top: 1px solid var(--border);
    margin: 4px 0;
  }
  .content {
    flex: 1;
    overflow: auto;
    padding: 24px;
  }
  .page {
    max-width: 720px;
    display: grid;
    gap: 20px;
  }
  h1.title {
    font-size: 24px;
    font-weight: 600;
    letter-spacing: -0.01em;
    margin: 0;
  }
  .lede {
    color: var(--muted-foreground);
    margin: 4px 0 0;
  }
  .profile {
    display: flex;
    gap: 14px;
    align-items: center;
  }
  .profile dl {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 2px 16px;
    margin: 0;
  }
  .profile dt {
    color: var(--muted-foreground);
  }
  .profile dd {
    margin: 0;
    min-width: 0;
    overflow-wrap: anywhere;
  }
  .form-actions {
    display: flex;
    justify-content: flex-end;
  }
  .toast {
    position: absolute;
    right: 16px;
    bottom: 16px;
    width: min(360px, calc(100% - 32px));
    background: var(--background);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow:
      0 8px 24px oklch(0.2 0.01 286 / 0.12),
      0 1px 3px oklch(0.2 0.01 286 / 0.08);
    padding: 14px 16px;
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 2px 10px;
  }
  .toast svg {
    color: var(--success);
    grid-row: span 2;
    margin-top: 2px;
  }
  .toast b {
    font-weight: 600;
  }
  .toast span {
    color: var(--muted-foreground);
    font-size: 13px;
  }
  @media (max-width: 720px) {
    .sidebar {
      display: none;
    }
    .content {
      padding: 16px;
    }
    .user-name {
      display: none;
    }
  }
</style>

<div class="review" role="region" aria-label="Review controls">
  <strong>Mockup · slice 1.2</strong>
  <div class="review-group">
    <span>Screen</span>
    <button class="chip" data-screen="login" aria-pressed="true">Login</button>
    <button class="chip" data-screen="menu" aria-pressed="false">User menu</button>
    <button class="chip" data-screen="account" aria-pressed="false">Account</button>
  </div>
  <div class="review-group" id="login-states">
    <span>Login</span>
    <button class="chip" data-login="default" aria-pressed="true">Default</button>
    <button class="chip" data-login="submitting" aria-pressed="false">Signing in</button>
    <button class="chip" data-login="invalid" aria-pressed="false">Wrong password</button>
    <button class="chip" data-login="validation" aria-pressed="false">Empty fields</button>
    <button class="chip" data-login="expired" aria-pressed="false">Session expired</button>
  </div>
  <div class="review-group" id="account-states" hidden>
    <span>Password form</span>
    <button class="chip" data-account="default" aria-pressed="true">Default</button>
    <button class="chip" data-account="validation" aria-pressed="false">Validation</button>
    <button class="chip" data-account="wrong" aria-pressed="false">Wrong current</button>
    <button class="chip" data-account="saving" aria-pressed="false">Saving</button>
    <button class="chip" data-account="done" aria-pressed="false">Changed</button>
  </div>
  <p class="notes" id="notes"></p>
</div>

<div class="frame" id="frame"></div>

<script>
  const icons = {
    alert:
      '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>',
    info: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>',
    check:
      '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>',
    user: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>',
    logout:
      '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5M21 12H9"/></svg>',
    chevron:
      '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>',
  };
  const user = {
    name: 'Linh Tran',
    email: 'manager@nova.test',
    team: 'Growth',
    role: 'Manager',
  };
  const state = { screen: 'login', login: 'default', account: 'default' };
  const notes = {
    login: {
      default:
        'Login has no sidebar. Opening /deals while signed out lands here with ?redirect=/deals, and signing in goes back to /deals.',
      submitting: 'Button shows a spinner and both fields are disabled while the request runs.',
      invalid:
        'Same message for an unknown email and a wrong password, so the form does not reveal which emails exist.',
      validation: 'Checked in the browser with the shared zod schema before any request.',
      expired:
        'Shown when the refresh token is no longer valid (7 days idle, 30 days since sign-in, or revoked).',
    },
    menu: 'Header right side: initials + name. The menu shows email, team and role, then Account and Log out.',
    account: {
      default: 'Account page: profile is read-only (admin manages users in a later phase).',
      validation: 'Errors under each field, from the shared zod schema.',
      wrong: 'Current password is checked by the API (401), shown under that field.',
      saving: 'Button shows a spinner while saving.',
      done: 'Success: toast, form cleared. Other devices are signed out; this one stays signed in.',
    },
  };

  function field({ id, label, type = 'text', value = '', error, hint, disabled, autocomplete }) {
    return `<div class="field"><label for="${id}">${label}</label>
      <input id="${id}" type="${type}" value="${value}" autocomplete="${autocomplete}" ${
        error ? 'aria-invalid="true"' : ''
      } ${disabled ? 'disabled' : ''} />
      ${error ? `<span class="err">${error}</span>` : hint ? `<span class="hint">${hint}</span>` : ''}</div>`;
  }

  function login() {
    const s = state.login;
    const busy = s === 'submitting';
    const banner =
      s === 'invalid'
        ? `<div class="alert alert-error" role="alert">${icons.alert}<span>Invalid email or password.</span></div>`
        : s === 'expired'
          ? `<div class="alert alert-info" role="status">${icons.info}<span>Your session has expired. Sign in again to continue.</span></div>`
          : '';
    const email = s === 'validation' ? '' : 'manager@nova.test';
    const password = s === 'validation' ? '' : '••••••••••••';
    return `<div class="login"><div class="login-wrap">
      <div class="login-brand"><div class="logo" aria-hidden="true">N</div><b>Nova CRM</b></div>
      <form class="card" onsubmit="return false">
        <div><h1>Sign in</h1><p class="sub">Use your Nova Agency work email.</p></div>
        ${banner}
        ${field({ id: 'email', label: 'Email', type: 'email', value: email, autocomplete: 'username', disabled: busy, error: s === 'validation' ? 'Enter your email.' : '' })}
        ${field({ id: 'password', label: 'Password', type: 'password', value: password, autocomplete: 'current-password', disabled: busy, error: s === 'validation' ? 'Enter your password.' : '' })}
        <button class="btn btn-primary" type="submit" ${busy ? 'disabled' : ''}>${
          busy ? '<span class="spinner" aria-hidden="true"></span>Signing in…' : 'Sign in'
        }</button>
      </form>
      <p class="login-foot">No account? Ask an admin of your team.</p>
    </div></div>`;
  }

  function shell(content, { menuOpen = false, title = 'Dashboard', toast = '' } = {}) {
    const initials = user.name
      .split(' ')
      .map((p) => p[0])
      .join('');
    const items = ['Contacts', 'Companies', 'Deals', 'Activities']
      .map((n) => `<span class="item">${n}<span class="soon">Soon</span></span>`)
      .join('');
    const menu = menuOpen
      ? `<div class="menu" role="menu">
          <div class="menu-head"><b>${user.name}</b><span>${user.email}</span>
            <span class="role"><span class="tag">${user.team}</span><span class="tag">${user.role}</span></span></div>
          <button role="menuitem" data-go="account">${icons.user}Account</button>
          <hr /><button role="menuitem" data-go="login">${icons.logout}Log out</button></div>`
      : '';
    return `<aside class="sidebar"><div class="brand"><div class="logo" aria-hidden="true">N</div>
        <div class="brand-text"><b>Nova CRM</b><small>Nova Agency</small></div></div>
        <nav class="nav"><span class="item">Dashboard</span><div class="nav-label">CRM</div>${items}</nav>
        <div class="sidebar-foot"><span class="dot"></span>All systems operational</div></aside>
      <div class="main"><header class="header">
        <div class="crumbs"><span>Nova CRM</span><span aria-hidden="true">/</span><b>${title}</b></div>
        <button class="user-btn" id="user-btn" aria-haspopup="menu" aria-expanded="${menuOpen}">
          <span class="avatar" aria-hidden="true">${initials}</span><span class="user-name">${user.name}</span>${icons.chevron}</button>
        ${menu}</header>
        <main class="content">${content}</main></div>${toast}`;
  }

  function dashboard() {
    return `<div class="page"><div><h1 class="title">Dashboard</h1><p class="lede">Overview of your workspace.</p></div>
      <div class="card"><h2>System status</h2><p class="sub">API and database are online.</p></div></div>`;
  }

  function account() {
    const s = state.account;
    const busy = s === 'saving';
    const initials = user.name
      .split(' ')
      .map((p) => p[0])
      .join('');
    const filled = s === 'done' ? '' : '••••••••••';
    const toast =
      s === 'done'
        ? `<div class="toast" role="status">${icons.check}<b>Password changed</b><span>Other devices have been signed out.</span></div>`
        : '';
    const content = `<div class="page"><div><h1 class="title">Account</h1><p class="lede">Your profile and password.</p></div>
      <section class="card" aria-labelledby="profile-h"><h2 id="profile-h">Profile</h2>
        <div class="profile"><span class="avatar lg" aria-hidden="true">${initials}</span>
          <dl><dt>Name</dt><dd>${user.name}</dd><dt>Email</dt><dd>${user.email}</dd>
          <dt>Team</dt><dd>${user.team}</dd><dt>Role</dt><dd>${user.role}</dd></dl></div>
        <p class="sub" style="margin:0">To change your name or team, ask an admin.</p></section>
      <form class="card" aria-labelledby="pw-h" onsubmit="return false">
        <div><h2 id="pw-h">Change password</h2><p class="sub">You stay signed in here. Other devices will be signed out.</p></div>
        ${field({ id: 'current', label: 'Current password', type: 'password', value: s === 'validation' ? '' : filled, autocomplete: 'current-password', disabled: busy, error: s === 'wrong' ? 'Current password is incorrect.' : s === 'validation' ? 'Enter your current password.' : '' })}
        ${field({ id: 'new', label: 'New password', type: 'password', value: s === 'validation' ? '•••' : filled, autocomplete: 'new-password', disabled: busy, hint: 'At least 8 characters.', error: s === 'validation' ? 'Use at least 8 characters.' : '' })}
        ${field({ id: 'confirm', label: 'Confirm new password', type: 'password', value: s === 'validation' ? '••••' : filled, autocomplete: 'new-password', disabled: busy, error: s === 'validation' ? 'Passwords do not match.' : '' })}
        <div class="form-actions"><button class="btn btn-primary" type="submit" ${busy ? 'disabled' : ''}>${
          busy ? '<span class="spinner" aria-hidden="true"></span>Saving…' : 'Change password'
        }</button></div></form></div>`;
    return shell(content, { title: 'Account', toast });
  }

  function render() {
    const frame = document.getElementById('frame');
    frame.innerHTML =
      state.screen === 'login'
        ? login()
        : state.screen === 'menu' || state.screen === 'home'
          ? shell(dashboard(), { menuOpen: state.screen === 'menu' })
          : account();
    document.getElementById('login-states').hidden = state.screen !== 'login';
    document.getElementById('account-states').hidden = state.screen !== 'account';
    document.querySelectorAll('[data-screen]').forEach((c) => {
      c.setAttribute('aria-pressed', String(c.dataset.screen === state.screen));
    });
    document.querySelectorAll('[data-login]').forEach((c) => {
      c.setAttribute('aria-pressed', String(c.dataset.login === state.login));
    });
    document.querySelectorAll('[data-account]').forEach((c) => {
      c.setAttribute('aria-pressed', String(c.dataset.account === state.account));
    });
    document.getElementById('notes').textContent =
      state.screen === 'menu' || state.screen === 'home'
        ? notes.menu
        : notes[state.screen][state[state.screen]];

    const userBtn = document.getElementById('user-btn');
    if (userBtn) {
      userBtn.addEventListener('click', () => {
        // Toggle the menu over the current page (menu open = dashboard behind it).
        state.screen = state.screen === 'menu' ? 'home' : 'menu';
        render();
      });
    }
    frame.querySelectorAll('[data-go]').forEach((b) =>
      b.addEventListener('click', () => {
        state.screen = b.dataset.go;
        if (state.screen === 'login') state.login = 'default';
        render();
      }),
    );
  }

  document.querySelectorAll('[data-screen]').forEach((b) =>
    b.addEventListener('click', () => {
      state.screen = b.dataset.screen;
      render();
    }),
  );
  document.querySelectorAll('[data-login]').forEach((b) =>
    b.addEventListener('click', () => {
      state.login = b.dataset.login;
      render();
    }),
  );
  document.querySelectorAll('[data-account]').forEach((b) =>
    b.addEventListener('click', () => {
      state.account = b.dataset.account;
      render();
    }),
  );
  render();
</script>
